
    <div class="container mt-5">
        <h2 class="text-center">Select Payment Method</h2>
        <div class="card p-4 shadow-lg">
            <button class="btn-close position-absolute" style="top: 10px; right: 15px;" (click)="goBack()"></button>
            <ul class="nav nav-tabs" id="paymentTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="upi-tab" data-bs-toggle="tab" data-bs-target="#upi" type="button" role="tab">UPI</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="card-tab" data-bs-toggle="tab" data-bs-target="#card" type="button" role="tab">Credit/Debit Card</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="netbanking-tab" data-bs-toggle="tab" data-bs-target="#netbanking" type="button" role="tab">Net Banking</button>
                </li>
                
            </ul>
            <div class="tab-content mt-3" id="paymentContent">
                <div class="tab-pane fade show active" id="upi" role="tabpanel">
                    <h5>Choose UPI App</h5>
                    <div class="d-flex justify-content-around">
                        <img src="download.png" alt="GPay" class="payment-logo" width="100px" height="100px">
                        <img src="download (1).png" alt="PhonePe" class="payment-logo" width="90px" height="80px">
                        <img src="download (2).png" alt="Paytm" class="payment-logo" width="90px" height="80px">
                    </div>
                    <input type="text" class="form-control mt-3" placeholder="Enter UPI ID">
                    <button class="btn btn-primary w-100 mt-3">Pay Now</button>
                </div>
                <div class="tab-pane fade" id="card" role="tabpanel">
                    <h5>Enter Card Details</h5>
                    <input type="text" class="form-control mb-2" placeholder="Card Number">
                    <input type="text" class="form-control mb-2" placeholder="Cardholder Name">
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control" placeholder="MM/YY">
                        <input type="text" class="form-control" placeholder="CVV">
                    </div>
                    <button class="btn btn-primary w-100 mt-3">Pay Now</button>
                </div>
                <div class="tab-pane fade" id="netbanking" role="tabpanel">
                    <h5>Select Bank</h5>
                    <select class="form-control">
                        <option>HDFC Bank</option>
                        <option>ICICI Bank</option>
                        <option>SBI Bank</option>
                        <option>Axis Bank</option>
                    </select>
                    <button class="btn btn-primary w-75 mt-3">Proceed</button>
                </div>
            </div>
        </div>
    </div>
