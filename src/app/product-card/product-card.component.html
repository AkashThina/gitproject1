<div class="container h-100 mt-3">
  <div class="row h-100 align-items-stretch">
    <!-- Product Image Card -->
    <div id="div3" class="col-md-6 d-flex">
      <div class="card shadow-lg equal-height">
        <img [src]="product.image" alt="Product Image" class="mt-4 ms-5 w-75" height="300px">
        <h4 class="mt-3 text-center"  style="text-align: justify;"><b>{{ product.title }}</b></h4>
      </div>
    </div>

    <!-- Product Details Card -->
    <div class="col-md-5 d-flex">
      <div class="card shadow-lg equal-height">
        <button class="btn-close align-self-end m-2" id="button1" (click)="goBack()"></button>

        <div class="card-body">
          <h4 ><b>{{ product.title }}</b></h4>
          <p><b>Category:</b> {{ product.category }}</p>
          <p style="text-align: justify;" class="me-3"><b>Description:</b> {{ product.description }}</p>
          <p><b>Rating:</b> ⭐ {{ product.rating?.rate ?? 'N/A' }} </p>
          <p><b>Price:</b> $ {{ product.price }}</p>

          <p><b>Stock:</b> 
            <span [ngClass]="{
              'text-danger': product.stock === 0,
              'text-success': product.stock > 0
            }">
              {{ product.stock }} {{product.rating?.count}}
            </span>
          </p>
          <div>
            <button class="btn btn-warning " (click)="addToCart()" [disabled]="!product">
              Add to Cart <i class="bi bi-cart"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
